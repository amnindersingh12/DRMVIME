<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }

    h3 {
      margin: 0 0 15px 0;
      color: #1a73e8;
    }

    .section {
      margin-bottom: 15px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    button {
      padding: 8px 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 5px;
    }

    button:hover {
      background: #1557b0;
    }

    button.secondary {
      background: #5f6368;
    }

    button.secondary:hover {
      background: #3c4043;
    }

    .status {
      padding: 8px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    .info {
      background: #e8f0fe;
      color: #1967d2;
    }

    .label {
      font-weight: 500;
      margin-bottom: 5px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h3>🎬 TwinVine Capturer</h3>

  <div class="section">
    <div class="label">Queue Status</div>
    <div id="status" class="status info">
      <strong>Queue:</strong> <span id="queueCount">0</span> lessons
    </div>
  </div>

  <div class="section">
    <button id="viewQueue">View Queue</button>
    <button id="clearQueue" class="secondary">Clear Queue</button>
  </div>

  <div id="queueList" style="display: none; margin-top: 10px; max-height: 200px; overflow-y: auto;">
    <!-- Queue items will be inserted here -->
  </div>

  <script src="popup.js"></script>
</body>

</html>
