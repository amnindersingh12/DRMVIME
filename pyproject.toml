# pyproject.toml (root)

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
envied = { workspace = true }

[project]
name = "twinvine"
version = "1.0.0"
description = "DRM-protected course video downloader for Testbook"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "pywidevine>=1.8.0",
]

# Optional shared dev deps
[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "scrapy>=2.13.3",
]

[tool.uv]
constraint-dependencies = ["lxml>=6.0.2"]
